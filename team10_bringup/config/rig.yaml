# Real robot overrides, loaded after params.yaml (config:=rig).
# Check the camera topic with `ros2 topic list | grep camera`.

camera_node:
  ros__parameters:
    image_topic: /camera/image_raw/compressed
    use_compressed: true
    # [m] black square side, without the white border. Measure the printed markers,
    # or check it on the robot: put a marker a tape-measured distance in front of
    # the camera, read range in the camera_node "Detected id .." log, and set
    #     marker_size = current marker_size * measured distance / logged range
    marker_size: 0.1
    # camera_frame is left unset: the robot's camera already stamps its images
    # with camera_rgb_optical_frame
